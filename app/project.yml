name: WoofTube
options:
  bundleIdPrefix: com.laskywolf
  deploymentTarget:
    iOS: "26.0"
  # An .icon is a folder that Xcode reads as one file.
  fileTypes:
    icon:
      file: true
      buildPhase: resources
packages:
  SwiftyTube:
    url: https://github.com/686udjie/SwiftyTube.git
    from: 0.0.6
  MPVKit:
    url: https://github.com/mpvkit/MPVKit.git
    from: 1.0.0
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  WoofTube:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: WoofTube
    dependencies:
      - package: SwiftyTube
      - package: MPVKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.laskywolf.wooftube.native
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "Amber Brown Cyan Green Indigo Lime Orange Pink Purple Red Teal"
    info:
      path: WoofTube/Info.plist
      properties:
        CFBundleDisplayName: WoofTube
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
