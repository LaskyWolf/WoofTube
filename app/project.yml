name: WoofTube
options:
  bundleIdPrefix: com.laskywolf
  deploymentTarget:
    iOS: "26.0"
  # An .icon is a folder that Xcode reads as one file.
  fileTypes:
    icon:
      file: true
      buildPhase: resources
packages:
  SwiftyTube:
    url: https://github.com/686udjie/SwiftyTube.git
    exactVersion: 0.0.6
  # This fork adds mpv's video output for Apple's sample buffer layer, which Picture in Picture needs.
  MPVKit:
    url: https://github.com/streamyfin/MPVKit.git
    exactVersion: 0.41.0-av5
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.2"
    CURRENT_PROJECT_VERSION: "3"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  WoofTube:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: WoofTube
    dependencies:
      - package: SwiftyTube
      - package: MPVKit
        product: MPVKit-GPL
      - target: WoofTubeShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.laskywolf.wooftube.native
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "Amber Brown Cyan Green Indigo Lime Orange Pink Purple Red Teal"
    info:
      path: WoofTube/Info.plist
      properties:
        CFBundleDisplayName: WoofTube
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: com.laskywolf.wooftube.links
            CFBundleURLSchemes:
              - wooftube
              - youtube
              - vnd.youtube
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  # Adds WoofTube to the share sheet for YouTube links.
  WoofTubeShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.laskywolf.wooftube.native.share
        # The hand-over reaches the app object, which extension-only code may not name.
        APPLICATION_EXTENSION_API_ONLY: NO
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: WoofTube
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
