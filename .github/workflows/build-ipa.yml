name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Cache Theos
        uses: actions/cache@v5
        with:
          path: ~/theos
          key: theos-${{ runner.os }}-${{ hashFiles('scripts/setup-theos.sh') }}

      - name: Set up Theos
        run: scripts/setup-theos.sh

      - name: Build tweaks
        run: scripts/build-tweaks.sh

      # The repo is public: the IPA URL and the password stay in secrets,
      # and the IPA is only uploaded inside an encrypted archive.
      - name: Download YouTube IPA
        env:
          IPA_URL: ${{ secrets.IPA_URL }}
          IPA_PASSWORD: ${{ secrets.IPA_PASSWORD }}
        run: |
          if [[ -z "$IPA_URL" || -z "$IPA_PASSWORD" ]]; then
            echo "::error::Tweaks built. To build the IPA, add the IPA_URL and IPA_PASSWORD repository secrets (see README)."
            exit 1
          fi
          curl -fsSL "$IPA_URL" -o youtube.ipa

      - name: Inject tweaks
        run: scripts/build-ipa.sh youtube.ipa out/WoofTube.ipa

      - name: Encrypt IPA
        env:
          IPA_PASSWORD: ${{ secrets.IPA_PASSWORD }}
        run: 7z a -p"$IPA_PASSWORD" -mhe=on out/WoofTube.7z out/WoofTube.ipa

      - uses: actions/upload-artifact@v7
        with:
          name: WoofTube
          path: out/WoofTube.7z
          retention-days: 3
