name: Native app

on:
  push:
    branches:
      - native-app
    paths:
      - app/**
      - .github/workflows/app.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: latest-stable

      - name: Generate the Xcode project
        working-directory: app
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build
        working-directory: app
        run: |
          xcodebuild -project WoofTube.xcodeproj -scheme WoofTube -configuration Release \
            -derivedDataPath build -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package the IPA
        working-directory: app
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/WoofTube.app Payload/
          zip -qr WoofTube.ipa Payload

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: WoofTube-native
          path: app/WoofTube.ipa
          retention-days: 1

      # Turns the addresses in a crash report back into function names.
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: WoofTube-dSYM
          path: app/build/Build/Products/Release-iphoneos/WoofTube.app.dSYM
          retention-days: 30
